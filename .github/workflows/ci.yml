name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    # A test that hangs must fail in minutes, not after the 6 hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          # scripts/coverage.sh builds into its own target directory.
          cache-directories: target/coverage/target
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Docs
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Coding guide rules
        run: cargo run --quiet -p quality -- core app tools
      - name: Python scripts
        run: python3 -I scripts/check-python.py
      - name: Feature specs
        run: python3 -I scripts/check-specs.py
      - name: Tests and coverage
        # The run takes about 5 minutes. Cargo prints the name of a test that
        # runs over 60 seconds, so a hang shows which test it is.
        timeout-minutes: 15
        # A run that is still going after 8 minutes is stuck. Print the
        # processes and where the test program is waiting, so the log shows why.
        run: |
          (
            sleep 480
            echo "::group::stuck test run: processes"
            ps -axo pid,ppid,etime,stat,command | grep -E 'naran|git' | grep -v grep || true
            echo "::endgroup::"
            for pid in $(pgrep -f naran_app- || true); do
              echo "::group::stuck test run: sample of process $pid"
              sample "$pid" 5 2>&1 | head -400 || true
              echo "::endgroup::"
              echo "::group::stuck test run: open files of process $pid"
              lsof -p "$pid" 2>&1 | grep -E 'PIPE|git' | head -60 || true
              echo "::endgroup::"
            done
          ) &
          watch=$!
          status=0
          scripts/coverage.sh || status=$?
          kill "$watch" 2>/dev/null || true
          exit "$status"

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Check the dependencies against the RustSec advisories
        run: cargo audit
