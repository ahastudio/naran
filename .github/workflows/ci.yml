name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup show
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Docs
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Coding guide rules
        run: cargo run --quiet -p quality -- core app tools
      - name: Python scripts
        run: python3 -I scripts/check-python.py
      - name: Feature specs
        run: python3 -I scripts/check-specs.py
      - name: Tests and coverage
        run: scripts/coverage.sh

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Check the dependencies against the RustSec advisories
        run: cargo audit
