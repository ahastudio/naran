[package]
name = "naran-app"
description = "Naran desktop app built with GPUI"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "naran_app"
path = "src/lib.rs"

[[bin]]
name = "naran-app"
path = "src/main.rs"

[dependencies]
naran-core = { path = "../core" }
gpui = { version = "0.2.2", default-features = false, features = ["runtime_shaders", "font-kit"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
dirs = "7"
unicode-segmentation = "1"
notify = "8.2.2"
ignore = "0.4"
futures = "0.3"

[dev-dependencies]
tempfile = "3.27.0"
gpui = { version = "0.2.2", default-features = false, features = ["runtime_shaders", "font-kit", "test-support"] }

[lints]
workspace = true
